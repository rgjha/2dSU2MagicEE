[pytest]
# Harmless TenPy warnings (su2_magic.py silences them in normal runs; pytest re-enables warnings):
#  - unit_cell_width: the default (all sites in one unit cell) is correct here
#  - qtotal: exact-diag -> MPS conversion of an all-zero block; charge 0 is correct
filterwarnings =
    ignore:unit_cell_width is a new argument:UserWarning
    ignore:can't detect total charge:UserWarning
